# Renueva la clave de Instagram una vez por semana (vence a los 60 días si no se renueva)
# y la guarda en el secret IG_TOKEN. Necesita el secret GH_PAT con permiso para escribir secrets.
name: Instagram · renovar clave

on:
  schedule:
    - cron: "23 13 * * 1"   # lunes 10:23, hora de Buenos Aires
  workflow_dispatch:

permissions:
  issues: write

jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pedir una clave nueva a Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          NUEVO_TOKEN_EN: ${{ runner.temp }}/ig_token
        run: python3 .github/instagram/renovar_token.py

      - name: Guardarla como secret IG_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret GH_PAT: sin él no puedo guardar la clave nueva."
            exit 1
          fi
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
          rm -f "$RUNNER_TEMP/ig_token"

      - name: Avisar a Mario si algo falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create instagram --color 1ddd65 --description "Publicación automática de Instagram" --force >/dev/null 2>&1 || true
          gh issue create --label instagram \
            --title "Instagram: no se pudo renovar la clave" \
            --body "La renovación semanal de la clave de Instagram falló: $RUN_URL. Si la clave vence (60 días desde la última renovación), hay que generar una nueva en el panel de Meta y pegarla en el secret IG_TOKEN (ver .github/instagram/LEEME.md)."
