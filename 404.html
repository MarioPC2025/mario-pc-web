<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VBVPJ6H5H5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-VBVPJ6H5H5');
    </script>

    <meta name="robots" content="noindex, follow">
    <title>Página no encontrada · Mario PC</title>

    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
    <meta name="theme-color" content="#07090a">
    <script>try{if(localStorage.getItem('mpc-theme')==='light'){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.content='#f4f6f5'}}catch(e){}</script>
    <link rel="stylesheet" href="/theme.css?v=2">
    <link rel="stylesheet" href="/site.css?v=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css" integrity="sha384-pPVoXE8ft+zxKtxIDDI7SfTK6y95NHm4qa+hKEg/hs8VkjW5IP+9/dGOPCbDpUPl" crossorigin="anonymous">

    <style>
        .solo { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 48px 20px 96px; }
        .solo h1 em { font-style: normal; color: var(--green); }
        .solo .lead { max-width: 440px; }
        .solo .lead strong { color: var(--white); font-weight: 500; }
        .solo-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .solo-foot { position: absolute; bottom: 28px; left: 20px; right: 20px; font-size: 0.85rem; color: var(--muted); cursor: pointer; user-select: none; transition: opacity 0.15s ease; }
        .error-logo { width: 56px; height: 56px; object-fit: contain; margin-bottom: 12px; }
        .error-code { font-family: var(--font-display); font-size: clamp(6rem, 20vw, 12rem); line-height: 0.85; letter-spacing: 0.02em; color: var(--white); cursor: pointer; user-select: none; transition: transform 0.15s ease; }
        .error-code em { font-style: normal; color: var(--green); }
        .error-code:active { transform: scale(0.96); }
        .error-code.fixed-pulse { animation: fixed-pulse 0.6s ease; }
        @keyframes fixed-pulse { 0% { transform: scale(1); } 30% { transform: scale(1.12); } 60% { transform: scale(0.97); } 100% { transform: scale(1); } }
        .solo h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); }
        .error-safe {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 44px; padding: 10px 16px;
            background: none; border: 1px dashed rgba(var(--ink-rgb), 0.14); border-radius: 3px; color: var(--muted);
            font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; transition: color 0.2s, border-color 0.2s, background-color 0.2s;
        }
        .error-safe i { font-size: 1rem; color: var(--green); }
        .error-safe:hover { border-color: var(--green-border); color: var(--green); background: var(--green-dim); }
        @media (prefers-reduced-motion: reduce) { .error-code.fixed-pulse { animation: none; } }
    </style>
</head>
<body>

<div class="grain"></div>

<button type="button" class="theme-toggle theme-toggle--float" aria-pressed="false" aria-label="Activar modo claro" title="Modo claro"><i class="ph ph-sun" aria-hidden="true"></i></button>

<main>
<div class="solo">
    <a href="/"><img src="/logo.png?v=2" alt="Mario PC, ir al inicio" class="error-logo" width="56" height="56"></a>

    <div class="error-code" id="errorCode">4<em>0</em>4</div>
    <h1 class="display" id="errorTitle">Esta página no existe</h1>
    <p class="lead" id="errorDesc">
        Parece que el link está roto o la página fue movida. Volvé al inicio o escribime directamente por WhatsApp si necesitás ayuda.
    </p>

    <div class="solo-actions">
        <a href="/" class="btn btn-primary">
            <i class="ph ph-house" aria-hidden="true"></i>
            Volver al inicio
        </a>
        <a href="https://wa.me/5491123999259" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
            <i class="ph-fill ph-whatsapp-logo" aria-hidden="true"></i>
            Escribir por WhatsApp
        </a>
    </div>

    <button type="button" class="error-safe" id="safeBtn">
        <i class="ph ph-lifebuoy" aria-hidden="true"></i>
        Llevame a un lugar seguro
    </button>

    <div class="solo-foot">© 2026 Mario PC · Olivos, Buenos Aires</div>
</div>
</main>

<div class="rickroll-overlay" id="rickrollOverlay" role="dialog" aria-modal="true" aria-labelledby="rickrollCaption">
    <div class="rickroll-caption" id="rickrollCaption">Nunca te voy a <em>dejar tirado</em></div>
    <iframe id="rickrollFrame" src="" title="Video sorpresa" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    <p class="rickroll-sub">El lugar más seguro de internet 🎵</p>
    <button type="button" class="rickroll-close" id="rickrollClose">
        <i class="ph ph-x"></i> Cerrar
    </button>
</div>

<div class="egg-toast" id="eggToast"></div>

<script>
    (function () {
        const codeEl = document.getElementById('errorCode');
        const titleEl = document.getElementById('errorTitle');
        const descEl = document.getElementById('errorDesc');
        let clicks = 0;
        let resetTimer;
        let fixed = false;

        codeEl.addEventListener('click', () => {
            if (fixed) return;
            clicks++;
            clearTimeout(resetTimer);
            resetTimer = setTimeout(() => { clicks = 0; }, 1500);

            if (clicks >= 5) {
                fixed = true;
                codeEl.innerHTML = '200 <em>OK</em>';
                codeEl.classList.add('fixed-pulse');
                titleEl.textContent = '¡Arreglado!';
                descEl.textContent = 'Viste qué fácil? Ojalá tu PC se arreglara sola así. Para el resto, estoy yo.';
            }
        });
    })();

    (function () {
        const overlay = document.getElementById('rickrollOverlay');
        const frame = document.getElementById('rickrollFrame');
        const closeBtn = document.getElementById('rickrollClose');
        const safeBtn = document.getElementById('safeBtn');
        if (!overlay || !safeBtn) return;

        function open() {
            if (overlay.classList.contains('active')) return;
            frame.src = 'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0';
            overlay.classList.add('active');
            try { closeBtn.focus({ preventScroll: true }); } catch (e) {}
            if (window.gtag) gtag('event', 'rickroll_visto', { origen: '404' });
        }

        function close() {
            if (!overlay.classList.contains('active')) return;
            overlay.classList.remove('active');
            frame.src = '';
            try { safeBtn.focus({ preventScroll: true }); } catch (e) {}
            showEggToast('Te dije que era seguro 😉');
        }

        safeBtn.addEventListener('click', open);
        closeBtn.addEventListener('click', close);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    })();

    function showEggToast(msg, duration) {
        const toast = document.getElementById('eggToast');
        toast.textContent = msg;
        toast.classList.add('visible');
        clearTimeout(showEggToast._t);
        showEggToast._t = setTimeout(() => toast.classList.remove('visible'), duration || 2600);
    }

    (function () {
        const footerEl = document.querySelector('.solo-foot');
        if (!footerEl) return;
        const original = footerEl.textContent;
        const phrases = [
            original,
            '© 2026 Mario PC · Hecho con mucho café ☕',
            '© 2026 Mario PC · Ni esta página se salva de un bug',
            '© 2026 Mario PC · Si llegaste hasta acá, sos mi cliente ideal',
            '© 2026 Mario PC · Gracias por curiosear 🕵️'
        ];
        let idx = 0;
        footerEl.addEventListener('click', () => {
            idx = (idx + 1) % phrases.length;
            footerEl.style.opacity = '0';
            setTimeout(() => {
                footerEl.textContent = phrases[idx];
                footerEl.style.opacity = '1';
            }, 150);
        });
    })();
</script>

<script src="/theme.js?v=2" defer></script>
</body>
</html>
