    <title>¡Gracias por tu mensaje! · Mario PC</title>

    <meta name="theme-color" content="#07090a">
    <script>try{if(localStorage.getItem('mpc-theme')==='light'){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name="theme-color"]');if(m)m.content='#f4f6f5'}}catch(e){}</script>
    <link rel="stylesheet" href="/theme.css?v=2">
    <link rel="stylesheet" href="/site.css?v=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css" integrity="sha384-pPVoXE8ft+zxKtxIDDI7SfTK6y95NHm4qa+hKEg/hs8VkjW5IP+9/dGOPCbDpUPl" crossorigin="anonymous">

    <style>
        .solo { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 48px 20px 96px; }
        .solo h1 em { font-style: normal; color: var(--green); }
        .solo .lead { max-width: 440px; }
        .solo .lead strong { color: var(--white); font-weight: 500; }
        .solo-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .solo-foot { position: absolute; bottom: 28px; left: 20px; right: 20px; font-size: 0.85rem; color: var(--muted); cursor: pointer; user-select: none; transition: opacity 0.15s ease; }
        .solo-icon { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; color: var(--green); background: var(--green-dim); box-shadow: 0 0 0 1px var(--green-border); font-size: 2.4rem; }
        .solo h1 { font-size: clamp(2.8rem, 7vw, 5rem); }
    </style>
</head>
<body>

<div class="grain"></div>

<button type="button" class="theme-toggle theme-toggle--float" aria-pressed="false" aria-label="Activar modo claro" title="Modo claro"><i class="ph ph-sun" aria-hidden="true"></i></button>

<main>
<div class="solo">
    <div class="solo-icon"><i class="ph-fill ph-check" aria-hidden="true"></i></div>

    <h1 class="display">¡Ya casi<br><em>terminamos!</em></h1>
    <p class="lead">
        Se abrió WhatsApp en una pestaña nueva con tu mensaje listo. Solo falta que le des <strong>enviar</strong> ahí. Si no se abrió, escribime directo por WhatsApp.
    </p>

    <div class="solo-actions">
        <a href="/" class="btn btn-primary">
            <i class="ph ph-house" aria-hidden="true"></i>
            Volver al inicio
        </a>
        <a href="https://wa.me/5491123999259" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
            <i class="ph-fill ph-whatsapp-logo" aria-hidden="true"></i>
            Escribir por WhatsApp
        </a>
    </div>

    <div class="solo-foot">© 2026 Mario PC · Olivos, Buenos Aires</div>
</div>
</main>

<script>
    (function () {
        const footerEl = document.querySelector('.solo-foot');
        if (!footerEl) return;
        const original = footerEl.textContent;
        const phrases = [
            original,
            '© 2026 Mario PC · Hecho con mucho café ☕',
            '© 2026 Mario PC · Gracias de nuevo, en serio',
            '© 2026 Mario PC · Sos mi cliente favorito (no le digas a los demás)',
            '© 2026 Mario PC · Gracias por curiosear 🕵️'
        ];
        let idx = 0;
        footerEl.addEventListener('click', () => {
            idx = (idx + 1) % phrases.length;
            footerEl.style.opacity = '0';
            setTimeout(() => {
                footerEl.textContent = phrases[idx];
                footerEl.style.opacity = '1';
            }, 150);
        });
    })();
</script>

<script src="/theme.js?v=2" defer></script>
</body>
</html>
